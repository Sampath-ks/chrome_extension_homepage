<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <link rel="stylesheet" href="newtab.css">
</head>
<body>
    <!-- Full-screen wallpaper background container -->
    <!-- Handles user-picked presets or uploaded images -->
    <div id="background-container"></div>
    <div id="background-overlay"></div>

    <!-- Full-screen video wallpaper element (hidden by default) -->
    <video id="video-wallpaper" autoplay muted loop playsinline></video>

    <div id="layout-container">
        <!-- Left side column: nav + boards -->
        <div id="main-column">
            <div id="top-nav">
                <button id="home-tab">Home</button>
                <button id="add-board-btn" title="Add Board">+</button>
            </div>

            <div id="boards-container"></div>
        </div>

        <!-- Right side vertical toolbar -->
        <div id="side-toolbar">
            <button class="toolbar-btn" title="Search">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </button>
            <button class="toolbar-btn" title="Downloads">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            </button>
            <button class="toolbar-btn" title="Incognito">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h20"></path><path d="M9 12v-2a3 3 0 0 1 6 0v2"></path><circle cx="6" cy="16" r="4"></circle><circle cx="18" cy="16" r="4"></circle><line x1="10" y1="16" x2="14" y2="16"></line></svg>
            </button>
        </div>
    </div>

    <!-- Add Tile Modal -->
    <div id="add-tile-modal" class="hidden">
        <div class="modal-content">
            <h3>Add Shortcut</h3>
            <input type="text" id="tile-name-input" placeholder="Site Name">
            <input type="url" id="tile-url-input" placeholder="URL">
            <div class="modal-actions">
                <button id="cancel-add-tile">Cancel</button>
                <button id="save-tile">Save</button>
            </div>
        </div>
    </div>

    <!-- Wallpaper Picker UI -->
    <div id="wallpaper-picker">
        <div id="wallpaper-thumbnails" class="hidden">
            <!-- Tab switcher -->
            <div class="wp-tabs">
                <button class="wp-tab-btn active" id="wp-tab-image">Images</button>
                <button class="wp-tab-btn" id="wp-tab-live">&#9654; Live</button>
            </div>
            <!-- Image wallpapers section -->
            <div id="wp-section-image" class="wp-section"></div>
            <!-- Live / video wallpapers section -->
            <div id="wp-section-live" class="wp-section" style="display:none;"></div>
        </div>
        <button id="wallpaper-toggle" title="Change Wallpaper">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
        </button>
        <input type="file" id="wallpaper-upload-input" accept="image/*" style="display: none;">
        <input type="file" id="video-upload-input" accept=".mp4,.webm" style="display: none;">
    </div>

    <script src="newtab.js"></script>
</body>
</html>
