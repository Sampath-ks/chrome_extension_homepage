<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <link rel="stylesheet" href="newtab.css">
</head>

<body>
    <!-- Full-screen wallpaper background container -->
    <!-- Handles user-picked presets or uploaded images -->
    <div id="background-container"></div>
    <div id="background-overlay"></div>

    <!-- Full-screen video wallpaper element (hidden by default) -->
    <video id="video-wallpaper" autoplay muted loop playsinline></video>

    <div id="layout-container">
        <!-- Left side column: nav + boards -->
        <div id="main-column">
            <div id="top-nav">
                <button id="home-tab">Home</button>
                <button id="add-board-btn" title="Add Board">+</button>
            </div>

            <div id="boards-container"></div>
        </div>

        <!-- Right side: tool panel + toolbar -->
        <div id="right-side">
            <!-- Sliding tool panel -->
            <div id="tool-panel">
                <div id="tool-panel-header">
                    <span id="tool-panel-title"></span>
                    <button id="tool-panel-close" title="Close panel">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
                <div id="tool-panel-content">
                    <!-- Tool content will be dynamically injected here -->
                </div>
            </div>

            <!-- Right side vertical toolbar -->
            <div id="side-toolbar">
                <button class="toolbar-btn" id="incognito-btn" title="Incognito">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 12h20"></path>
                        <path d="M9 12v-2a3 3 0 0 1 6 0v2"></path>
                        <circle cx="6" cy="16" r="4"></circle>
                        <circle cx="18" cy="16" r="4"></circle>
                        <line x1="10" y1="16" x2="14" y2="16"></line>
                    </svg>
                </button>
                <button class="toolbar-btn" data-panel="notes" title="Quick Notes">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                    </svg>
                </button>
                <button class="toolbar-btn" data-panel="colorpicker" title="Color Picker">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>
                    </svg>
                </button>
                <button class="toolbar-btn" data-panel="qrcode" title="QR Code Generator">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                        <rect x="14" y="14" width="3" height="3"></rect>
                        <line x1="21" y1="14" x2="21" y2="14.01"></line>
                        <line x1="21" y1="21" x2="21" y2="21.01"></line>
                        <line x1="17" y1="21" x2="17" y2="21.01"></line>
                        <line x1="21" y1="17" x2="21" y2="17.01"></line>
                    </svg>
                </button>
                <button class="toolbar-btn" data-panel="unitconverter" title="Unit Converter">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6h4v12H2z"></path><path d="M6 12h4"></path><path d="M14 6l6 12"></path><path d="M20 6l-6 12"></path><path d="M15 18h4"></path></svg>
                </button>
                <button class="toolbar-btn" data-panel="imgcompress" title="Image Compressor">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><polyline points="8 12 12 8 16 12"></polyline><polyline points="8 16 12 12 16 16"></polyline></svg>
                </button>
                <button class="toolbar-btn" data-panel="settings" title="Settings">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path
                            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z">
                        </path>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Add Tile Modal -->
    <div id="add-tile-modal" class="hidden">
        <div class="modal-content">
            <h3>Add Shortcut</h3>
            <input type="text" id="tile-name-input" placeholder="Site Name">
            <input type="url" id="tile-url-input" placeholder="URL">
            <div class="modal-actions">
                <button id="cancel-add-tile">Cancel</button>
                <button id="save-tile">Save</button>
            </div>
        </div>
    </div>

    <!-- Wallpaper Picker UI -->
    <div id="wallpaper-picker">
        <div id="wallpaper-thumbnails" class="hidden">
            <!-- Tab switcher -->
            <div class="wp-tabs">
                <button class="wp-tab-btn active" id="wp-tab-image">Images</button>
                <button class="wp-tab-btn" id="wp-tab-live">&#9654; Live</button>
            </div>
            <!-- Image wallpapers section -->
            <div id="wp-section-image" class="wp-section"></div>
            <!-- Live / video wallpapers section -->
            <div id="wp-section-live" class="wp-section" style="display:none;"></div>
        </div>
        <button id="wallpaper-toggle" title="Change Wallpaper">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
        </button>
        <input type="file" id="wallpaper-upload-input" accept="image/*" style="display: none;">
        <input type="file" id="video-upload-input" accept=".mp4,.webm" style="display: none;">
    </div>

    <script src="qrcode.min.js"></script>
    <script src="newtab.js"></script>
</body>

</html>
